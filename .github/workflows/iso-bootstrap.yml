name: ISO interpreter bootstrap

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iso-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl
      - name: Run ISO tagged-term and meta-interpreter assertions
        run: sbcl --noinform --disable-debugger --script tests/iso/bootstrap-tests.lisp
      - name: Check ISO call/N closure execution and variable sharing
        run: sbcl --noinform --disable-debugger --script tests/iso/call-tests.lisp
      - name: Check ISO control, cut and conditional semantics
        run: sbcl --noinform --disable-debugger --script tests/iso/control-tests.lisp
      - name: Compare tagged ISO evaluator with the original .pl execution path
        run: sbcl --noinform --disable-debugger --script tests/iso/differential-tests.lisp
